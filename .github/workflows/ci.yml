# CI —— mc-whitelist（Python 3.12 / FastAPI）
#
# 触发与权限按框架固定不动（references/ci-recipes.md 的通用骨架）。
# 步骤块取「Python / pip」配方，并替换成**本仓库真实存在**的命令：
#   * 依赖：requirements.txt + requirements-dev.txt（仓库里都有）
#   * 测试：pytest -q（README「本地开发」与 tests/ 都是 pytest）
#   * 构建：本服务是 Python 应用，无构建产物；用「编译全部源码 + 导入 app.main」代替
#     —— 它能真实拦住语法错误与模块级导入错误，比空跑的 build 有意义。
# 注意：仓库里没有 ruff 配置，**不臆造 `ruff check .`**；如需 lint 先加配置再加这步。
name: CI

on:
  pull_request:
    branches: [main, prod]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Syntax check
        run: python -m compileall -q app tests

      # app.config 的 rcon_password 没有默认值（缺了即启动失败，fail closed），
      # 所以导入 app.main 必须先给齐这些变量 —— 与 tests/conftest.py 里的测试值一致，
      # 全部是假值，不含任何真实凭据。
      - name: Import check
        env:
          RCON_PASSWORD: ci-dummy-not-a-real-secret
          DATABASE_URL: sqlite:////tmp/mc-whitelist-ci.db
          SSO_ISSUER: https://146.56.237.33/auth
          SSO_JWKS_URL: https://146.56.237.33/auth/.well-known/jwks.json
          JWT_AUDIENCE: elicloud-services
          REQUIRED_SCOPE: mc:whitelist
          LOG_LEVEL: warning
        run: python -c "import app.main; print('app.main imported ok')"

      - name: Test
        run: pytest -q

  # 硬性约束：prod 只允许从 main 发 PR 合并。
  # GitHub 的分支保护无法原生表达这条规则，所以在这里用必过检查强制它。
  # 把本 job 加入 prod 的 Required status checks 即可生效。
  guard-prod-source:
    name: Guard prod source
    if: ${{ github.event_name == 'pull_request' && github.base_ref == 'prod' }}
    runs-on: ubuntu-latest
    steps:
      - name: Only main may target prod
        # base_ref/head_ref 的值是分支名，分支名里可以有 " $ ; ` 等字符。
        # 直接写进 shell（如 "${{ github.head_ref }}"）就是 GitHub 官方点名的
        # 脚本注入模式，actionlint 的 expression 规则也会报错。
        # 一律经 env 传入，脚本里只用 shell 变量。
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          echo "base=${BASE_REF} head=${HEAD_REF}"
          if [ "${HEAD_REF}" != "main" ]; then
            echo "::error::只有 main 可以发 PR 到 prod（当前 head=${HEAD_REF}）"
            exit 1
          fi
          echo "OK: PR 来自 main"
